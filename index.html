<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accolade</title>
    <link rel="preload" as="image" href="photos/main_bg.jpeg" />
    <style>
      html, body {
        background-color: #14110e;
      }
    </style>
    <meta name="description" content="Accolade.clo — Premium clothing label based in Dhaka. Wear your Accolade." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- ACCOLADE_Clo129   //ACCOLADE_Clo129-->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap");
      @import url("https://fonts.cdnfonts.com/css/sansation");
      @import url("https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700;800&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&display=swap");

      /* Base theme colors */
      :root {
        --sand: #f4efe8;
        --sand-strong: rgba(15, 15, 15, 0.85);
        --cream: rgba(25, 25, 25, 0.75);
        --brown: #ffffff;
        --brown-dark: #9c3b2e;
        --accent: #e8ddcf;
        --accent-dark: #d4c5b5;
        --muted: #e2d5c5;
        --price: #dfb76c;
        --button-bg: #faf7f2;
        --button-text: #1f1f1f;
        --button-hover: #9c3b2e;
        --button-hover-text: #faf7f2;
        --badge: #c4342f;
        --card-bg: rgba(20, 20, 20, 0.55);
        --card-border: rgba(255, 255, 255, 0.15);
        --header-footer: #7a6a4f;
        --header-height: 86px;
        --shadow: 0 18px 45px rgba(30, 24, 14, 0.14);
        --shadow-soft: 0 10px 28px rgba(30, 24, 14, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      body {
        font-family: "Cinzel", "Sansation", "Inter", sans-serif;
        background-color: #1a1510;
        background-image: url('photos/main_bg.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: var(--brown);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Header ─────────────────────────────── */
      .site-header {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 60;
        background: rgba(15, 15, 15, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--card-border);
        width: 100%;
        max-width: 100vw;
      }
      .nav-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: var(--header-height);
        width: 100%;
        padding: 0 2rem;
      }
      .nav-left { justify-self: start; }
      .nav-right {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .brand-center {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
      }
      .brand-mark {
        width: 28px; height: 28px;
        border-radius: 999px;
        border: 2px solid var(--brown);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: transparent;
        flex-shrink: 0;
      }
      .brand-mark img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 50%;
      }
      .brand-text {
        font-family: "Cinzel", "Sansation", "Inter", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fff;
        line-height: 1;
      }
      .nav-link {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .nav-link:hover { color: #fff; }
      .cart-btn-header {
        position: relative;
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
        padding: 6px 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease, transform 0.2s ease;
        text-decoration: none;
        line-height: 1;
      }
      .cart-btn-header:hover {
        color: #fff;
        transform: translateY(-1px);
      }
      .cart-btn-header .cart-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--badge);
        color: #ffffff !important;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        line-height: 1;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
      }

      /* Hamburger */
      .hamburger {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Mobile menu */
      #mobile-menu {
        display: none;
        position: fixed;
        top: var(--header-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--header-height));
        background-color: var(--sand-strong);
        padding: 2rem;
        flex-direction: column;
        gap: 1.5rem;
        z-index: 50;
        border-top: 1px solid var(--card-border);
        animation: fadeIn 0.3s ease-out;
      }
      #mobile-menu.open { display: flex; }
      #mobile-menu a {
        font-family: "Cinzel", serif;
        font-size: 1.5rem;
        color: var(--brown);
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 0.1em;
      }
      #mobile-menu .admin-menu-link {
        margin-top: auto;
        padding-top: 1.5rem;
        font-family: "Inter", sans-serif !important;
        font-size: 0.7rem !important;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: none !important;
        color: rgba(255, 255, 255, 0.28) !important;
      }
      #mobile-menu .admin-menu-link:hover {
        color: rgba(255, 255, 255, 0.45) !important;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Main / Hero ─────────────────────────── */
      .page-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: var(--header-height);
        /* push footer to bottom naturally */
      }

      .hero-nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        text-align: center;
        padding: 60px 24px;
      }

      .hero-nav-link {
        font-family: "Cinzel", serif;
        font-size: clamp(1.6rem, 4vw, 2.8rem);
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        transition: color 0.25s ease, letter-spacing 0.25s ease;
      }
      .hero-nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 100%;
        height: 1px;
        background: rgba(255,255,255,0.55);
        transition: transform 0.3s ease;
        transform-origin: center;
      }
      .hero-nav-link:hover {
        color: rgba(255,255,255,0.75);
        letter-spacing: 0.22em;
      }
      .hero-nav-link:hover::after {
        transform: translateX(-50%) scaleX(1);
      }

      /* ── Footer ─────────────────────────────── */
      .site-footer {
        background: rgba(10, 10, 10, 0.95);
        border-top: 1px solid var(--card-border);
        width: 100%;
      }
      .footer-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .footer-links {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .footer-links a {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .footer-links a:hover,
      .footer-links a.active { color: #fff; }
      .footer-copy {
        font-family: "Inter", sans-serif;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(255,255,255,0.28);
      }

      /* ── Responsive ─────────────────────────── */
      @media (max-width: 768px) {
        :root { --header-height: 70px; }
        .nav-inner { padding: 0 1rem; }
        .brand-text { font-size: 11px; letter-spacing: 0.15em; }
        .hero-nav { gap: 24px; padding: 40px 24px; }
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="site-header">
      <nav class="nav-inner">

        <!-- LEFT: Hamburger -->
        <div class="nav-left">
          <button class="hamburger" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>

        <!-- CENTER: Brand -->
        <a href="index.html" class="brand-center">
          <div class="brand-mark">
            <img src="favicon.ico" alt="Accolade logo" />
          </div>
          <span class="brand-text">ACCOLADE</span>
        </a>

        <!-- RIGHT: Shop + Cart -->
        <div class="nav-right">
          <a class="nav-link" href="shop.html">Shop</a>
          <a id="cart-button" class="cart-btn-header" href="shop.html?checkout=true" aria-label="Cart">
            <i class="fas fa-shopping-bag"></i>
            <span id="cart-badge" class="cart-badge">0</span>
          </a>
        </div>

      </nav>
    </header>

    <!-- Mobile menu (outside header to avoid contain:paint clipping) -->
    <div id="mobile-menu">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" class="admin-menu-link">Admin</a>
    </div>

    <!-- Main content: centered nav links -->
    <main class="page-body">
      <nav class="hero-nav" aria-label="Main navigation">
        <a id="link-shop"    class="hero-nav-link" href="shop.html">Shop Now</a>
        <a id="link-about"   class="hero-nav-link" href="about.html">About</a>
        <a id="link-contact" class="hero-nav-link" href="contact.html">Contact</a>
      </nav>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
        <p class="footer-copy">&copy; 2026 Accolade.clo. All rights reserved.</p>
      </div>
    </footer>

    <script>
      function updateHeaderCartBadge() {
        try {
          const cart = JSON.parse(localStorage.getItem("accolade_cart") || "[]");
          const count = Array.isArray(cart) ? cart.reduce((sum, item) => sum + (item.quantity || 1), 0) : 0;
          const badge = document.getElementById("cart-badge");
          if (badge) badge.textContent = String(count);
        } catch (e) {}
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateHeaderCartBadge();
        const hamburger = document.querySelector('.hamburger');
        const mobileMenu = document.getElementById('mobile-menu');

        if (hamburger && mobileMenu) {
          hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenu.classList.toggle('open');
            const icon = hamburger.querySelector('i');
            if (mobileMenu.classList.contains('open')) {
              icon.classList.replace('fa-bars', 'fa-times');
            } else {
              icon.classList.replace('fa-times', 'fa-bars');
            }
          });

          document.addEventListener('click', (e) => {
            if (!mobileMenu.contains(e.target) && !hamburger.contains(e.target)) {
              if (mobileMenu.classList.contains('open')) {
                mobileMenu.classList.remove('open');
                const icon = hamburger.querySelector('i');
                icon.classList.replace('fa-times', 'fa-bars');
              }
            }
          });
        }
      });
    </script>

  </body>
</html>
